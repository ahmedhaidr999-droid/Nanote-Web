org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Constrained build machine tuning (2 cores / 4GB RAM):
# - small Gradle heap, Kotlin compilation in-process (no separate daemon JVM),
#   workers capped at 2.
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
