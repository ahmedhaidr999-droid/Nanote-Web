name: nanote
description: Nanote native — notebooks, PDF & ink workspace (Flutter).
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # PDF engine (PDFium on Android — page render + real page sizes).
  pdfx: '>=2.6.0 <3.0.0'
  # Vector ink outlines (pressure + velocity aware).
  perfect_freehand: '>=2.0.0 <3.0.0'
  path_provider: ^2.1.0
  # Library: import PDFs / images / stickers, share exports.
  file_picker: 8.3.7
  share_plus: '>=10.0.0 <12.0.0'
  # Audio notes (record aac, playback with position stream).
  record: 6.2.1
  audioplayers: '>=6.0.0 <7.0.0'
  # Export to PDF.
  pdf: 3.11.3
  url_launcher: ^6.3.0
  intl: '>=0.19.0 <0.21.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
